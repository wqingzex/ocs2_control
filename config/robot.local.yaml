# 本机配置（./scripts/start.sh / ./init.sh 默认读取本文件，遥操作和推理都用）。
# 上半部分：启动什么（机型、手、真机 / 仿真、相机）；字段说明和默认值见 src/robot_teleop/fa_teleop/config/teleop.yaml，
# 只写与默认值不同的项即可。下半部分：这台机器的硬件参数（platform / defaults / hardware / control），由 ROS 启动文件读取。
# 首次使用：ros2 run orbbec_camera list_devices_node 查出相机序列号并填入下方 serial（或 ./init.sh cameras）。

robot:
  entry: split_body
  hand: linkerhand_l6       # none | linkerhand_l6 | xhand1（xhand1 只支持 usb）
  hand_drive: usb           # usb | marvin（天机 485）
  hardware: real

cameras:
  head:        {serial: ""}   # Gemini 335Lg
  left_wrist:  {serial: ""}   # Gemini 305
  right_wrist: {serial: ""}   # Gemini 305

# ---- 硬件参数（ROS 启动文件读取）------------------------------------------------------------------
#
# 末端类型只在上面的 robot.hand 里写一处（start.sh 据此传 type:=）。platform + control.patch 每次启动都生效。

platform:
  chassis: linkhou_s2_v2          # linkhou_s2 | linkhou_s2_v2
  chassis_joints_movable: "false"
  arm_ctrl_mode: position      # position | joint_impedance

hardware:
  max_joint_speed: 100
  max_joint_acceleration: 100
  body_can_interface: can0     # 腰、头（Juxie）的 CAN FD 接口；改它之后重新运行 ./scripts/setup.sh host，让免密 sudo 规则用同一个名字
  # body_can_stats_period_s: 10  # 真机上测总线速度和稳定性时打开：每 10 秒打印一次控制线程和 CAN 的统计（默认 0，只在停止时打印一次）
  usb_left_port: /dev/ttyUSB0
  usb_right_port: /dev/ttyUSB1

  left_dyn_param: [0.6497676459118699, -113.76123112932677, 6.3156014233807785, 113.55178760318341, 0.0004732591214889805, 0.0, 0.0, 0.001, 0.0, 0.0023915258776710897]
  #left_dyn_param: [0.6061754175874171, 17.267177902344816, 11.326736270552631, 126.75031836778503, 0.002544509338714862, 0.0, 0.0, 0.003932295996385773, 0.0, 0.0013602018288431186]
  #right_dyn_param: [0.6536955673989341, -6.907040931579219, -15.635830276008924, 115.70908035188748, 0.0009709177058226156, 0.0, 0.0, 0.001, 0.0, 0.0007998490956465841]
  right_dyn_param: [0.5506509164175232, -15.374754125643323, -13.016418046470896, 168.9681173327475, 0.001, 0.0, 0.0, 0.001, 0.0, 0.0008090164205250557]

control:
  patch:
    body_joint_controller:
      ros__parameters:
        home_1: [-0.50, -1.10, -0.60, 0.0]
        home_2: [-0.50, -1.10, -0.60, 0.0]

    arm_controller:
      ros__parameters:
        info_file_name: task_tcp
        home_duration: 2.0
        home_1: [ 1.157133809892805, -1.0633699963902674, -1.0994065285584414, -1.0074199090303408, -0.8049558811978124, -0.4064381599253574, -0.1175225067208675,
              -1.157133809892805, -1.0633699963902674, 1.0994065285584414, -1.0074199090303408, 0.8049558811978124, -0.4064381599253574, 0.1175225067208675]
        home_2: [ 1.157133809892805, -1.0633699963902674, -1.0994065285584414, -1.0074199090303408, -0.8049558811978124, -0.4064381599253574, -0.1175225067208675,
              -1.157133809892805, -1.0633699963902674, 1.0994065285584414, -1.0074199090303408, 0.8049558811978124, -0.4064381599253574, 0.1175225067208675]

    # OCS2 task .info override (optional, per controller):
