# ======================================================================================================
# 本机配置模板：复制成 config/robot.local.yaml 后修改（./scripts/start.sh / ./scripts/setup.sh 默认读取它）。
#
# 标记：[必改] 新机器上要确认或修改 | [可选] 默认值够用，要改才取消注释 | [自动写入] 由 setup.sh / 网页控制台写回，不用手填
# 只写与默认值不同的项即可；字段的默认值和取值见 src/robot_hmi/robot_app/config/teleop.yaml。
# 首次使用：./scripts/setup.sh cam 确认相机画面与左右位置；./scripts/setup.sh hand 确认左右手。
#
# 结构：robot 里每个部件先写"是什么"（type），再写"怎么连"（interface）；control 是控制参数；
#       xr / cameras / record 是遥操作与采集。
# ======================================================================================================


# ######################################################################################################
# robot  机器：什么臂、什么底盘、什么末端，各自怎么连
# ######################################################################################################
robot:
  entry: whole_body              # [必改] 控制入口：whole_body（fa_w2 全身，WBC）| split_body（fa_w2 分体）| dual_arm（M6-CCS 双臂）
  hardware: real                 # [必改] 运行方式：real（真机）| mock_components（仿真）| isaac；下面各部件的 interface 只在真机生效
  # variant: ""                  # [可选] 整机外观变体，空 = 机型默认

  # ---- 底盘 -------------------------------------------------------------------------------------------
  base:
    type: linkhou_s2             # [必改] linkhou_s2 | linkhou_s2_v2
    joints_movable: false        # 底盘关节是否可动

  # ---- 腰、头 ------------------------------------------------------------------------------------------
  body:
    type: juxie                  # JX 电机，CAN FD 通信
    interface:
      can: can0                  # CAN FD 接口；改它之后重新运行 ./scripts/setup.sh host，让免密 sudo 规则用同一个名字
      # stats_period_s: 10       # [可选] 真机上测总线速度和稳定性时打开：每 10 秒打印控制线程和 CAN 统计（默认 0，只在停止时打印一次）

  # ---- 臂 ----------------------------------------------------------------------------------------------
  arm:
    type: marvin                 # 臂驱动：marvin（天机，M6 等）。目前只有 marvin 有机器模型
    interface:
      ip: 192.168.1.190          # 臂控制器的以太网地址；接在臂末端 485 口的手也走这个地址
      # firmware: 343            # [自动写入] SDK 版本：338（38 版固件）| 343（43 版及以上），要和臂控制器固件一致，选错驱动会急停。
      #                          #   留空时 ./scripts/setup.sh 会询问并写在这里（./scripts/setup.sh marvin 重新选择）

  # ---- 末端执行器（手或夹爪）-----------------------------------------------------------------------------
  end_effector:
    type: linkerhand_l6          # [必改] none | linkerhand_l6 | xhand1 | wuji_hand2 | jodell_rg75
    interface:
      bus: usb_rs485             # [必改] 手和电脑之间的总线，按末端选：
                                 #   usb_rs485 : 485 转 USB 接电脑（xhand1 只能用这个）
                                 #   arm_rs485 : 接机械臂末端 485 口（jodell_rg75 只能用这个）
                                 #   usb_can   : USB-CAN（只支持 linkerhand_l6）
                                 #   ethernet  : 网线（只给 wuji_hand2）
      # 左右手各自写所选总线用到的项：
      #   usb_rs485 -> port    串口，必须是 /dev/serial/by-id/… （按适配器序列号识别；./scripts/setup.sh hand 确认后写入）
      #   usb_can   -> can     CAN 接口（经典 CAN 1 Mbit/s，默认 can1 / can2）；不能用腰、头的 body.interface.can。
      #                        改了之后重新运行 ./scripts/setup.sh host，让免密 sudo 规则用同样的名字。
      #   arm_rs485 -> channel 485 通道 1 | 2 | 3（默认 1）
      left:  {port: ""}          # [自动写入] port
      right: {port: ""}
    # [可选] 每侧工具负载 [m, mx, my, mz, ixx, ixy, ixz, iyy, iyz, izz]；[] = 按末端类型取内置辨识值
    #   linkerhand_l6 -> 按侧辨识出的值（m6_ccs_description/xacro/eefs.xacro）；xhand1 -> 没有内置值，用驱动默认（0）
    #   跑完 ./scripts/setup.sh dyn（负载辨识）会自动写入这里
    # dyn_param:
    #   left: []
    #   right: []


# ######################################################################################################
# control  控制参数
# ######################################################################################################
control:
  # arm_mode: position           # [可选] 臂控制模式：position | joint_impedance
  limits:
    max_joint_speed: 100
    max_joint_acceleration: 100
  patch:                         # 对 ros2_control 控制器参数的覆盖
    body_joint_controller:
      ros__parameters:
        home_1: [-0.9, -1.8, -0.9, 0.0]
        home_2: [-1.3, -2.6, -1.3, 0.0]
    # [可选] OCS2 .info 选择：<robot>_description/config/ocs2/<info_file_name>.info，命名「范围_坐标系_变体」。
    #   whole_body_controller 可选 whole_body_fixed_{eef,tcp}_{l6,xhand}、whole_body_mobile_tcp（默认 whole_body_fixed_eef_l6）
    #   arm_controller        可选 dual_arm_eef、dual_arm_tcp（默认 dual_arm_eef）
    # whole_body_controller:
    #   ros__parameters:
    #     info_file_name: whole_body_fixed_tcp_l6
    # arm_controller:
    #   ros__parameters:
    #     info_file_name: dual_arm_tcp


# ######################################################################################################
# 遥操作与采集
# ######################################################################################################

# ---- XR 头显 ----------------------------------------------------------------------------------------
xr:
  network_mode: ethernet         # [可选] ethernet（默认，网线）| wifi（无线）
  network_interface: ""          # [自动写入] 初始化时选择的电脑网卡
  device_id: ""                  # [自动写入] 初始化配对后记录的头显 ID

# ---- 相机 ---------------------------------------------------------------------------------------------
cameras:                         # [自动写入] ./scripts/setup.sh cam 确认后写回序列号、USB 口、旋转
  head:        {serial: ""}      # Gemini 335Lg
  left_wrist:  {serial: ""}      # Gemini 305
  right_wrist: {serial: ""}      # Gemini 305

# ---- 录制 ---------------------------------------------------------------------------------------------
# record:                        # [可选] 默认录到 <工作区>/bags，只录关节
#   dir: ""                      #   录包目录，空 = bags/
#   extra_topics: []             #   每次录制额外加入的话题，如 ["/tf"]
