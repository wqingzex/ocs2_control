# 本机配置模板：复制成 config/robot.local.yaml 后修改（./scripts/start.sh / ./scripts/setup.sh 默认读取本文件，遥操作和推理都用）。
# 上半部分：启动什么（机型、手、真机 / 仿真、相机）；字段说明和默认值见 src/robot_hmi/teleop_app/config/teleop.yaml，
# 只写与默认值不同的项即可。下半部分：这台机器的硬件参数（platform / defaults / hardware / control），由 ROS 启动文件读取。
# 首次使用：./scripts/setup.sh cam 弹窗确认相机画面与左右位置；./scripts/setup.sh hand 确认左右手。

robot:
  entry: whole_body
  hand: linkerhand_l6       # none | linkerhand_l6 | xhand1 | wuji_hand2（xhand1 只支持 usb，wuji_hand2 只支持 ethernet）
  hand_drive: usb           # usb（485 转 USB 接电脑）| "485"（接机械臂 485 接口）| usb_can（USB-CAN，只支持 linkerhand_l6）| ethernet（wuji_hand2）
  hardware: real

xr:
  network_mode: ethernet   # ethernet（默认网线）| wifi（无线）
  network_interface: ""    # 初始化选择电脑网卡
  device_id: ""            # 初始化配对后自动记录头显 ID

# record:                  # 可选：录制（默认录到 <工作区>/bags，只录关节）
#   dir: ""                 # 录包目录，空 = bags/
#   extra_topics: []        # 每次录制额外加入的话题，如 ["/tf"]

cameras:
  head:        {serial: ""}   # Gemini 335Lg
  left_wrist:  {serial: ""}   # Gemini 305
  right_wrist: {serial: ""}   # Gemini 305

# ---- 硬件参数（ROS 启动文件读取）------------------------------------------------------------------
#
# 末端类型只在上面的 robot.hand 里写一处（start.sh 据此传 type:=）。
# platform + control.patch apply on every launch that sets robot_profile:=...
# left_dyn_param / right_dyn_param: optional per-side load override (10 values).
# Leave them out to let the robot xacro pick dyn_param by end-effector type.

platform:
  chassis: linkhou_s2          # linkhou_s2 | linkhou_s2_v2
  chassis_joints_movable: "false"
  arm_ctrl_mode: position      # position | joint_impedance

defaults:
  # Per-side load override [m, mx, my, mz, ixx, ixy, ixz, iyy, iyz, izz].
  # Empty [] -> robot xacro picks dyn_param by end-effector type:
  #   linkerhand_l6             -> per-side identified values in m6_ccs_description/xacro/eefs.xacro
  #   xhand1                    -> real hardware uses USB-485; simulation/visualization are supported
  # Fill in 10 values to override (e.g. after tool_dyn_identify_wizard).
  left_dyn_param: []
  right_dyn_param: []

hardware:
  # marvin_firmware: 343     # 天机臂 SDK 版本：338（38 版固件）| 343（43 版及以上），要和臂的控制器固件一致，选错驱动会急停；
                            # 留空时 ./scripts/setup.sh 会询问并写在这里（./scripts/setup.sh marvin 重新选择）
  max_joint_speed: 100
  max_joint_acceleration: 100
  body_can_interface: can0     # 腰、头（Juxie）的 CAN FD 接口；改它之后重新运行 ./scripts/setup.sh host，让免密 sudo 规则用同一个名字
  # body_can_stats_period_s: 10  # 真机上测总线速度和稳定性时打开：每 10 秒打印一次控制线程和 CAN 的统计（默认 0，只在停止时打印一次）
  usb_left_port: /dev/ttyUSB0
  usb_right_port: /dev/ttyUSB2
  # hand_drive: usb_can 时两只手的 CAN 接口（经典 CAN 1 Mbit/s）；不能用腰、头的 body_can_interface。
  # 改了之后重新运行 ./scripts/setup.sh host，让免密 sudo 规则用同样的名字。
  # left_ee_can_interface: can1
  # right_ee_can_interface: can2

control:
  patch:
    body_joint_controller:
      ros__parameters:
        home_1: [-0.9, -1.8, -0.9, 0.0]
        home_2: [-1.3, -2.6, -1.3, 0.0]
    # OCS2 .info 选择（可选）：<robot>_description/config/ocs2/<info_file_name>.info，命名「范围_坐标系_变体」。
    # whole_body_controller 可选 whole_body_fixed_{eef,tcp}_{l6,xhand}、whole_body_mobile_tcp（默认 whole_body_fixed_eef_l6）；
    # arm_controller 可选 dual_arm_eef、dual_arm_tcp（默认 dual_arm_eef）。
    # whole_body_controller:
    #   ros__parameters:
    #     info_file_name: whole_body_fixed_tcp_l6
    # arm_controller:
    #   ros__parameters:
    #     info_file_name: dual_arm_tcp
