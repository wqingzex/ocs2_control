/**:
  ros__parameters:
    # 线性控制缩放因子（用于手柄/键盘控制）
    linear_scale: 0.005
    
    # 角度控制缩放因子（用于手柄/键盘控制）
    angular_scale: 0.05
    
    # XR手柄位姿缩放因子（左右共用，范围建议 [0.75, 1.5]）
    xr_pose_scale: 1.0
    
    # XR 目标守卫：丢弃离末端太远、或相邻两帧跳变太大的目标，并记 [TEL-002]（只丢这一帧，不停机）
    xr_guard.enabled: true
    # 目标到当前末端的距离上限（m）
    xr_guard.max_target_distance: 0.3
    # 相邻两个通过守卫的目标之间的距离上限（m）
    xr_guard.max_target_step: 0.05
    # 开始跟随时，手柄位姿必须是这么近（毫秒）内收到的，否则该臂不开始跟随并记 [TEL-003]。占位值，真机上调
    xr_guard.stale_ms: 200

    # 底盘遥控（左摇杆按下开 / 关，只在 OCS2 可用；速度作为参考发给全身控制器，由它统一输出底盘速度）。默认关：关着时不创建发布者，
    # 误按左摇杆也没有任何效果。要用时改成 true，并先看 docs/使用手册.md 6.2.2 和 docs/待办.md 里上真机前的几条
    xr_base: false
    # 摇杆推满时的速度参考，占位值，真机上调。它只是全身控制器的偏好，最终底盘速度还受 MPC 的速度限幅和手臂跟踪影响
    xr_chassis.linear_scale: 0.1    # m/s，左摇杆前后 / 左右
    xr_chassis.angular_scale: 0.2   # rad/s，右摇杆转向
    # 底盘遥控开着时，摇杆帧停了这么久（毫秒）就发零速度参考并退出，记 [TEL-004]；头显断线、桥掉了都靠它。占位值
    xr_chassis.stale_ms: 200

    # 是否启用XR输入处理
    enable_xr: false

