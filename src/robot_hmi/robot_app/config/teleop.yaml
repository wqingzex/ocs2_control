# robot_control_suite bringup config: the defaults of the sections below (every field optional). They live in
# config/robot.local.yaml together with platform / defaults / hardware / control (see config/robot.template.yaml).
# Check without starting:  python3 -m robot_app.check <config file> <ws_root>

robot:
  entry: whole_body         # whole_body (fa_w2 whole body, WBC) | split_body (fa_w2 split body) | dual_arm (M6-CCS dual arm)
  end_effector: linkerhand_l6     # 末端（手或夹爪）：none | linkerhand_l6 | xhand1 | wuji_hand2 | jodell_rg75
  end_effector_bus: usb_rs485   # 末端接在哪条线上：usb_rs485（485 转 USB 接电脑）| arm_rs485（接机械臂末端 485 口）| usb_can（USB-CAN，只支持 linkerhand_l6）| ethernet（只给 wuji_hand2）；xhand1 只能 usb_rs485，jodell_rg75 只能 arm_rs485
  hardware: real            # real | mock_components | isaac

xr:
  enable: true              # start robot_app xr_bridge_node (XRoboToolkit -> /xr/*)
  start_pc_service: true    # start the XRoboToolkit PC Service if it is not running
  pc_service_script: /opt/apps/roboticsservice/runService.sh
  frame_timeout_ms: 300     # no headset frame for this long -> stop publishing, /teleop/connection_status=false
  reconnect_interval_s: 3.0 # re-init the SDK when the PC Service link stays down this long
  network_mode: ethernet   # ethernet（网线，默认）| wifi（无线）；选择电脑接入局域网的网卡
  network_interface: ""    # setup.sh xr 保存所选网卡；IP 变化后重新读取，不固定头显 IP
  device_id: ""            # setup.sh xr 收到追踪数据后保存的头显 ID；启动只接受此设备

log:
  mode: normal              # normal | debug: debug puts the loggers of our own components at DEBUG.
                            # Fixed for a run (nothing switches it while the system runs): change it and restart.

cameras:
  enable: true
  fps: 30                   # 30 | 60 (60 Hz is experimental on Gemini 305)
  white_balance: 5600
  ae_max_exposure: 120
  wrist_exposure: 50        # wrist cameras use fixed exposure / gain
  wrist_gain: 16
  # Bind cameras by serial number (list them: ros2 run orbbec_camera list_devices_node).
  # rotation: 0 | 90 | 180 | 270. usb_port is optional (e.g. "2-1.3").
  head:        {enable: true, serial: "", usb_port: "", rotation: 0}   # Gemini 335Lg
  left_wrist:  {enable: true, serial: "", usb_port: "", rotation: 0}   # Gemini 305
  right_wrist: {enable: true, serial: "", usb_port: "", rotation: 0}   # Gemini 305
