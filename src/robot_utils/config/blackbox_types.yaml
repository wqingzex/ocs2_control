# 黑匣子的记录类型：一个 id 对应一种“收到/发出了什么”，以及每个数值是什么。
#
# 唯一来源：C++ 的 robot_log/blackbox_types.hpp 里的常量必须和这里一致（test_blackbox_decoder.py 对照检查），
# 解码脚本 robot_log_tools/blackbox.py 用这里给 CSV 的列命名。
#
# id 的百位是链路段：1xx XR 桥，2xx 遥操作，3xx 控制器，4xx 硬件（还没有）。
#
# 字段
#   id       唯一整数
#   name     CSV 里的类型名
#   module   谁写这种记录
#   aux      记录里 aux 字段的含义
#   fields   每个数值（v0, v1, ...）的名字
#   array    数值是一个数组（名字前缀，列名 <前缀>0、<前缀>1 ...，个数取自记录里的 count）；和 fields 二选一

- id: 101
  name: xr_frame_in
  module: xr_bridge
  aux: "bit0 有头部位姿，bit1 有左手，bit2 有右手"
  fields: [head_x, head_y, head_z, head_qx, head_qy, head_qz, head_qw,
           left_x, left_y, left_z, left_qx, left_qy, left_qz, left_qw,
           right_x, right_y, right_z, right_qx, right_qy, right_qz, right_qw,
           left_trigger, left_grip, right_trigger, right_grip, device_timestamp_s]

- id: 102
  name: xr_publish
  module: xr_bridge
  aux: "0"
  fields: [age_ms, event]   # age_ms：这一帧从收到到发布隔了多久；event：按键事件编码

- id: 201
  name: tel_xr_in
  module: target_generator
  aux: "0 左手，1 右手"
  fields: [x, y, z, qw, qx, qy, qz]

- id: 202
  name: tel_target_out
  module: target_generator
  aux: "0 左臂，1 右臂"
  fields: [x, y, z, qw, qx, qy, qz]

# 301 目标输入：只有 MOVEJ 的关节轨迹（action/service）记了，MPC 的末端目标话题（OCS2 状态）在 MPC 节点里，还没记。
- id: 301
  name: ctl_target_in
  module: controller
  aux: "0 默认话题，1 left，2 right，3 body，4 head"
  array: target

- id: 302
  name: ctl_state
  module: controller
  aux: "FSM 状态编号（1 HOME，2 HOLD，3 MOVEJ，4 OCS2）；一条记录最多 28 个关节，多出的不记"
  array: position

- id: 303
  name: ctl_command
  module: controller
  aux: "FSM 状态编号"
  array: command

- id: 304
  name: ctl_fsm
  module: controller
  aux: "0"
  fields: [from_state, to_state, fsm_command]

- id: 401
  name: hw_read
  module: marvin_hardware / juxie_hardware
  aux: "0"
  array: position            # 这个周期从硬件读到的关节位置，弧度；一条记录最多 28 个关节

- id: 402
  name: hw_write
  module: marvin_hardware / juxie_hardware
  aux: "0"
  array: command             # 这个周期写给硬件的关节位置命令，弧度；一条记录最多 28 个关节
